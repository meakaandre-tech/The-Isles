name: Pack test
# Boots Minecraft 26.3 (Fabric) with The Isles: a server with only Fabric API and the data pack, the whole mod pack
# with a real client, generation timings of pack variants, and the Nether (every mod, client) - one job each, side by side. A last job puts the logs
# together, writes the report, pushes everything to the ci-logs branch and publishes the tested zips as a release.
# See packtest/README.md.
on:
  push:
    branches: ["nether-perf"]   # nether-perf branch only: Nether jobs, logs to ci-logs-*-nperf, nothing is published
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pack-test-${{ github.ref }}
  cancel-in-progress: true
env:
  # a run of another branch than pack-test keeps its logs apart (ci-logs-dh-*)
  SUFFIX: ${{ github.ref_name == 'pack-test' && ' ' || 'dh-' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [nperf, nperfmods, nether]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Phases of this job (packtest/phases)
        id: ph
        shell: bash
        run: |
          # packtest/nether-run: which of the jobs run (nperf: perf variants with Fabric API only, nperfmods: with every mod, nether: the full Nether test with the client)
          want=""
          if grep -qw "${{ matrix.part }}" packtest/nether-run; then
            case "${{ matrix.part }}" in
              nperf) want="nether netherperf nperfonly"; touch packtest/server-only;;
              nperfmods) want="nether nethermods netherperf nperfonly"; touch packtest/server-only;;
              nether) want="netherbase nether nethermods";;
            esac
          fi
          echo "phases=${want# }" >> "$GITHUB_OUTPUT"; echo "phases: ${want}"
      - uses: actions/setup-java@v4
        if: steps.ph.outputs.phases != ''
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        if: steps.ph.outputs.phases != '' && matrix.part == 'nether'
      - name: Rebuild the data pack from the layout and zip it
        if: steps.ph.outputs.phases != ''
        shell: bash
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p /tmp/ci
          # Biome providers (packtest/providers: ids of layout/providers.json; no file = vanilla biomes). Those with a public
          # URL are downloaded; a pack without one cannot be tested here (it may not be uploaded anywhere) and is left out.
          # Nothing of them is uploaded: the zip tested here stays on the runner, the release is built without them.
          want=""   # the Nether jobs build without biome providers
          echo "ISLES_PROVIDERS=${want:-none}" >> "$GITHUB_ENV"
          ISLES_PROVIDERS=${want:-none} python3 tools/build_pack.py | tee -a /tmp/ci/build.txt
          git status --porcelain datapack datapack-mods | grep -v server-only | tee /tmp/ci/datapack-drift.txt
          [ -s /tmp/ci/datapack-drift.txt ] && echo "WARNING: the committed data packs differ from the generator output" | tee -a /tmp/ci/build.txt
          src=datapack; [ -d build/the-isles ] && src=build/the-isles
          echo "pack under test: $src" | tee -a /tmp/ci/build.txt
          (cd $src && zip -q -r -X /tmp/the-isles-tested.zip .)
          (cd datapack-mods && zip -q -r -X /tmp/the-isles-mods-tested.zip .)
          ls -l /tmp/the-isles-tested.zip /tmp/the-isles-mods-tested.zip | tee -a /tmp/ci/build.txt
      - name: Run the tests
        if: steps.ph.outputs.phases != ''
        continue-on-error: true
        shell: bash
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          PHASES: ${{ steps.ph.outputs.phases }}
          PART: ${{ matrix.part }}
        run: LOGS_BRANCH="ci-logs-${PART}-nperf" bash packtest/run.sh
      - name: Keep the logs for the report job
        if: always() && steps.ph.outputs.phases != ''
        shell: bash
        run: |
          cd /tmp/ci && mv run.txt run-${{ matrix.part }}.txt 2>/dev/null; mv build.txt build-${{ matrix.part }}.txt 2>/dev/null
          rm -f report.txt verdict.txt commit.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.ph.outputs.phases != ''
        with:
          name: ci-${{ matrix.part }}
          path: /tmp/ci
          retention-days: 3
  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/parts
          pattern: ci-*
      - name: Report, logs to the ci-logs branch
        shell: bash
        run: |
          mkdir -p /tmp/ci
          for d in /tmp/parts/ci-nperf /tmp/parts/ci-nperfmods /tmp/parts/ci-nether; do [ -d $d ] && cp -r $d/. /tmp/ci/; done
          cat /tmp/ci/run-*.txt > /tmp/ci/run.txt 2>/dev/null || true; (cat /tmp/ci/build-*.txt 2>/dev/null || true) | sort -u > /tmp/ci/build.txt
          # the release only holds The Isles' own files: built here without any provider (vanilla biomes)
          ISLES_PROVIDERS=none python3 tools/build_pack.py > /dev/null
          (cd datapack && zip -q -r -X /tmp/the-isles-tested.zip .)
          (cd datapack-mods && zip -q -r -X /tmp/the-isles-mods-tested.zip .)
          python3 packtest/tools/report.py /tmp/ci > /tmp/ci/report.txt 2>&1 || { echo "FAIL"; echo "- report.py failed, see the end of report.txt"; } > /tmp/ci/verdict.txt
          head -80 /tmp/ci/report.txt; tail -5 /tmp/ci/report.txt; cat /tmp/ci/verdict.txt
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          cd /tmp/ci
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Pack test for ${GITHUB_SHA}"
          to=ci-logs-nperf
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "ci-logs:$to"
