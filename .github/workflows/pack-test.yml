name: Pack test
# Boots Minecraft 26.3 (Fabric) with The Isles: a server with only Fabric API and the data pack, the whole mod pack
# with a real client, generation timings of pack variants, and the Nether (every mod, client) - one job each, side by side. A last job puts the logs
# together, writes the report, pushes everything to the ci-logs branch and publishes the tested zips as a release.
# See packtest/README.md.
on:
  push:
    branches: ["pack-test", "dwarfhollow"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pack-test-${{ github.ref }}
  cancel-in-progress: true
env:
  # a run of another branch than pack-test keeps its logs and key branches apart (ci-logs-dh-*, ci-key-dh-*)
  SUFFIX: ${{ github.ref_name == 'pack-test' && ' ' || 'dh-' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [vanilla, pack, perf, nether]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Phases of this job (packtest/phases)
        id: ph
        shell: bash
        run: |
          want=""
          for w in $(cat packtest/phases); do
            case "${{ matrix.part }}:$w" in vanilla:vanilla|vanilla:baseline|vanilla:bisect|pack:pack|pack:speed|perf:perf|nether:netherbase|nether:nether|nether:nethermods) want="$want $w";; esac
          done
          echo "phases=${want# }" >> "$GITHUB_OUTPUT"; echo "phases: ${want}"
      - uses: actions/setup-java@v4
        if: steps.ph.outputs.phases != ''
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        if: steps.ph.outputs.phases != '' && (matrix.part == 'pack' || matrix.part == 'nether')
      - name: Rebuild the data pack from the layout and zip it
        if: steps.ph.outputs.phases != ''
        shell: bash
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p /tmp/ci
          # Biome providers (packtest/providers: ids of layout/providers.json; no file = vanilla biomes). Those with a public
          # URL are downloaded; the others are asked for (packtest/tools/vendor-recv.sh) and left out when nobody answers.
          # Nothing of them is uploaded: the zip tested here stays on the runner, the release is built without them.
          want=$( (cat packtest/providers 2>/dev/null || true) | tr -s ' \n' ',,' | sed 's/^,//;s/,$//')
          if [ -n "$want" ]; then
            (python3 tools/providers.py fetch 2>&1 || true) | tee /tmp/ci/build.txt
            (bash packtest/tools/vendor-recv.sh "${SUFFIX// /}${{ matrix.part }}" "$want" 2>&1 || true) | tee -a /tmp/ci/build.txt
          fi
          echo "ISLES_PROVIDERS=${want:-none}" >> "$GITHUB_ENV"
          ISLES_PROVIDERS=${want:-none} python3 tools/build_pack.py | tee -a /tmp/ci/build.txt
          git status --porcelain datapack datapack-mods | tee /tmp/ci/datapack-drift.txt
          [ -s /tmp/ci/datapack-drift.txt ] && echo "WARNING: the committed data packs differ from the generator output" | tee -a /tmp/ci/build.txt
          src=datapack; [ -d build/the-isles ] && src=build/the-isles
          echo "pack under test: $src" | tee -a /tmp/ci/build.txt
          (cd $src && zip -q -r -X /tmp/the-isles-tested.zip .)
          (cd datapack-mods && zip -q -r -X /tmp/the-isles-mods-tested.zip .)
          ls -l /tmp/the-isles-tested.zip /tmp/the-isles-mods-tested.zip | tee -a /tmp/ci/build.txt
      - name: Run the tests
        if: steps.ph.outputs.phases != ''
        continue-on-error: true
        shell: bash
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          PHASES: ${{ steps.ph.outputs.phases }}
          PART: ${{ matrix.part }}
        run: LOGS_BRANCH="ci-logs-${SUFFIX// /}${PART}" bash packtest/run.sh
      - name: Keep the logs for the report job
        if: always() && steps.ph.outputs.phases != ''
        shell: bash
        run: |
          cd /tmp/ci && mv run.txt run-${{ matrix.part }}.txt 2>/dev/null; mv build.txt build-${{ matrix.part }}.txt 2>/dev/null
          rm -f report.txt verdict.txt commit.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.ph.outputs.phases != ''
        with:
          name: ci-${{ matrix.part }}
          path: /tmp/ci
          retention-days: 3
  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/parts
          pattern: ci-*
      - name: Report, logs to the ci-logs branch
        shell: bash
        run: |
          mkdir -p /tmp/ci
          for d in /tmp/parts/ci-vanilla /tmp/parts/ci-pack /tmp/parts/ci-perf /tmp/parts/ci-nether; do [ -d $d ] && cp -r $d/. /tmp/ci/; done
          cat /tmp/ci/run-*.txt > /tmp/ci/run.txt 2>/dev/null || true; (cat /tmp/ci/build-vanilla.txt /tmp/ci/build-pack.txt 2>/dev/null || true) | sort -u > /tmp/ci/build.txt
          # the release only holds The Isles' own files: built here without any provider (vanilla biomes)
          ISLES_PROVIDERS=none python3 tools/build_pack.py > /dev/null
          (cd datapack && zip -q -r -X /tmp/the-isles-tested.zip .)
          (cd datapack-mods && zip -q -r -X /tmp/the-isles-mods-tested.zip .)
          python3 packtest/tools/report.py /tmp/ci > /tmp/ci/report.txt 2>&1 || { echo "FAIL"; echo "- report.py failed, see the end of report.txt"; } > /tmp/ci/verdict.txt
          head -80 /tmp/ci/report.txt; tail -5 /tmp/ci/report.txt; cat /tmp/ci/verdict.txt
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          cd /tmp/ci
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Pack test for ${GITHUB_SHA}"
          # a partial run (packtest/quick) does not replace the logs of the last full one
          if [ -f "$GITHUB_WORKSPACE/packtest/quick" ]; then to=ci-logs-quick; else to=ci-logs; fi
          [ "${SUFFIX// /}" = "" ] || to=ci-logs-dh
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "ci-logs:$to"
      - name: Publish the tested data pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # only when the run says so: packtest/publish exists and the report's verdict (first line of verdict.txt) is PASS
          if [ -f packtest/publish ] && [ "${GITHUB_REF_NAME}" = pack-test ] && head -1 /tmp/ci/verdict.txt 2>/dev/null | grep -q '^PASS'; then
            gh release delete pack-test-latest -y --cleanup-tag -R "${{ github.repository }}" || true
            sleep 3
            gh release create pack-test-latest /tmp/the-isles-tested.zip /tmp/the-isles-mods-tested.zip -R "${{ github.repository }}" --target "${GITHUB_SHA}" \
              --prerelease --title "The Isles - tested data pack (26.3)" \
              --notes "the-isles-tested.zip: the world (no mod needed). the-isles-mods-tested.zip: add it next to the first one when playing with Create, Create Nuclear and Create: Gunsmithing (their ores then follow the islands). Both have the vanilla biomes: Geophilic and Overrealm may not be redistributed, tools/build_pack.py builds them in from your own copies (README, Biome packs). Built from the pack-test branch at ${GITHUB_SHA} and run through packtest/ (see packtest/README.md and the ci-logs branch). $(sed -n '2,40p' /tmp/ci/verdict.txt)"
          else
            echo "not published"
          fi
